<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>UtauTTS - テスト</title>
</head>

<body>
    <h1>UtauTTS - テスト</h1>
    <p>テキスト</p>
    <textarea id="text" placeholder="こんにちは、今日はいい天気です。" rows="3" cols="40"></textarea>
    <p>ボイスバンク</p>
    <select id="voicebank"></select>
    <button onclick="reloadVoicebanks()">再読込</button>
    <p>イントネーション補正: <span id="intonation-value">0.6</span></p>
    <input id="intonation" type="range" min="0" max="1" step="0.1" value="0.6" oninput="document.getElementById('intonation-value').textContent=this.value">
    <br>
    <br>
    <button id="synth" onclick="synthesize()">合成</button>
    <p id="status"></p>
    <audio id="player" controls style="display:none"></audio>
    <script>
        async function loadVoicebanks() {
            const r = await fetch('/voicebanks');
            const data = await r.json();
            const sel = document.getElementById('voicebank');
            sel.replaceChildren();
            data.voicebanks.forEach(vb => {
                const opt = document.createElement('option');
                opt.value = vb.id;
                opt.textContent = vb.name;
                sel.appendChild(opt);
            });
        }

        async function reloadVoicebanks() {
            const status = document.getElementById('status');
            status.textContent = '音源を再読込中...';
            const r = await fetch('/voicebanks/reload', { method: 'POST' });
            const data = await r.json();
            if (!r.ok) { status.textContent = 'error: ' + data.error; return; }
            await loadVoicebanks();
            status.textContent = data.voicebanks.length + '音源を読込';
        }

        async function synthesize() {
            const text = document.getElementById('text').value.trim();
            if (!text) return;
            const btn = document.getElementById('synth');
            const status = document.getElementById('status');
            const player = document.getElementById('player');
            btn.disabled = true;
            status.textContent = '合成中...';
            try {
                const r = await fetch('/synthesize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        voicebank_id: document.getElementById('voicebank').value,
                        intonation_strength: Number(document.getElementById('intonation').value)
                    })
                });
                const data = await r.json();
                if (data.error) { status.textContent = 'error: ' + data.error; return; }
                const blob = new Blob(
                    [Uint8Array.from(atob(data.wav_base64), c => c.charCodeAt(0))],
                    { type: 'audio/wav' }
                );
                player.src = URL.createObjectURL(blob);
                player.style.display = 'block';
                player.play();
                status.textContent = '完了';
            } catch (e) {
                status.textContent = 'error: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        loadVoicebanks();
    </script>
</body>

</html>
